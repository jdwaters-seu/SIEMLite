name: AI PR Multi-Model Code Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PR Diff
        id: get_diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" \
            -H "Accept: application/vnd.github.diff" > pr_diff.patch

          if [ ! -s pr_diff.patch ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Static Bug Analysis (Semgrep)
        if: steps.get_diff.outputs.empty == 'false'
        continue-on-error: true
        run: |
          pip install --quiet semgrep
          semgrep scan --config auto --json --output semgrep_results.json || true

      - name: Run Multi-Model Review Pipeline
        if: steps.get_diff.outputs.empty == 'false'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - << 'EOF'
          import os
          import sys
          import json
          import urllib.request
          import urllib.error
          from concurrent.futures import ThreadPoolExecutor

          api_key = os.environ.get("OPENROUTER_API_KEY")
          repo = os.environ.get("REPO_NAME", "")
          pr_num = os.environ.get("PR_NUMBER", "")
          pr_title = os.environ.get("PR_TITLE", "No title provided")
          pr_body = os.environ.get("PR_BODY", "No description provided")

          if not api_key:
              print("Missing OPENROUTER_API_KEY secret.")
              sys.exit(1)

          with open("pr_diff.patch", "r", encoding="utf-8", errors="ignore") as f:
              diff_text = f.read()

          MAX_CHARS = 80000
          if len(diff_text) > MAX_CHARS:
              diff_text = diff_text[:MAX_CHARS] + "\n\n... [Diff truncated due to size limits] ..."

          # Parse Semgrep findings if available
          semgrep_findings = "No deterministic static issues found."
          if os.path.exists("semgrep_results.json"):
              try:
                  with open("semgrep_results.json", "r", encoding="utf-8") as f:
                      s_data = json.load(f)
                      matches = [
                          f"[{m.get('check_id', 'issue')}] {m.get('path', '')}:{m.get('start', {}).get('line', '')} - {m.get('extra', {}).get('message', '')}"
                          for m in s_data.get("results", [])
                      ]
                      if matches:
                          semgrep_findings = "\n".join(matches[:15])
              except Exception as e:
                  semgrep_findings = f"Could not parse Semgrep results: {e}"

          def query_openrouter(model_id, messages, temperature=0.7, timeout=120):
              payload = {
                  "model": model_id,
                  "messages": messages,
                  "temperature": temperature
              }
              req = urllib.request.Request(
                  "https://openrouter.ai/api/v1/chat/completions",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                      "HTTP-Referer": f"https://github.com/{repo}",
                      "X-Title": "GitHub Ensemble PR Reviewer"
                  }
              )
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      res_data = json.loads(response.read().decode("utf-8"))
                      return res_data["choices"][0]["message"]["content"]
              except urllib.error.HTTPError as e:
                  err_msg = e.read().decode("utf-8", errors="ignore")
                  print(f"Error querying {model_id} ({e.code}): {err_msg}")
                  return f"⚠️ Analysis skipped due to API error ({e.code})."
              except Exception as e:
                  print(f"Exception querying {model_id}: {e}")
                  return f"⚠️ Analysis error: {str(e)}"

          # Inspection prompt combining Diff + Semgrep Findings + PR Intent
          analysis_prompt = f"""You are a specialized automated code reviewer.
          PR Title: {pr_title}
          PR Description: {pr_body}

          Static Analysis (Semgrep) Output:
          {semgrep_findings}

          Analyze this unified git diff for:
          1. Concrete logic bugs, null pointer/undefined dereferences, or broken control flows.
          2. Edge cases and discrepancies between the PR's stated intent and the code.
          3. Security vulnerabilities and verified SAST warnings.
          4. Performance or resource leak issues.

          Strict guidelines:
          - Cite the specific file and line numbers where an issue exists.
          - Offer a concise, practical code fix.
          - Do NOT include stylistic or subjective formatting comments.
          - If the diff looks sound, confirm that no critical issues were detected.

          Git Diff:
          ```diff
          {diff_text}
          ```
          """

          messages = [
              {"role": "system", "content": "You are an automated, bug-focused code reviewer."},
              {"role": "user", "content": analysis_prompt}
          ]

          print("Querying analyzer models in parallel...")
          with ThreadPoolExecutor(max_workers=2) as executor:
              future_super_vl = executor.submit(
                  query_openrouter,
                  "nvidia/nemotron-3.5-super-vl:free",
                  messages,
                  1.0,
                  120
              )
              future_ultra = executor.submit(
                  query_openrouter,
                  "nvidia/nemotron-3-ultra-550b-a55b:free",
                  messages,
                  1.0,
                  120
              )
              report_super_vl = future_super_vl.result()
              report_ultra = future_ultra.result()

          # Synthesis prompt
          synthesis_prompt = f"""You are a Principal Software Architect synthesizing two automated code review reports into an executive GitHub PR review comment.

          ### PR Context:
          - **Title**: {pr_title}
          - **Description**: {pr_body}

          ### Raw Engine Reports:
          Report 1: {report_super_vl}
          Report 2: {report_ultra}
          SAST: {semgrep_findings}

          ### Output Rules & GitHub Markdown Requirements:
          1. **Never place multiline code blocks inside table cells** (this breaks GitHub Markdown tables). Use tables ONLY for brief 1-line summaries.
          2. Structure the review into these exact sections:

          ### 🚦 Executive Verdict
          - A 1-2 sentence overall assessment of stability and merge-readiness.
          - A concise Markdown summary table:
          | Priority | File & Line | Summary | Confidence |
          |---|---|---|---|
          | 🔴 Blocker | `api/alerts.go:119` | Missing zero/negative validation | High |
          | 🟡 Warning | `pkg/alerts/engine.go:43` | Unused mutex in Check() | High |

          ### 🛠️ Actionable Findings
          For each finding, create an individual block formatted like this:

          #### 🔴 [Blocker/Warning/Info]: Short Title
          - **File**: `path/to/file.go:L123`
          - **Impact**: Explain the exact runtime risk or bug.
          - **Suggested Fix**:
          ```go
          // Clean, runnable code snippet here
          ```
          """

          print("Synthesizing final comment with Nemotron 3.5 Lightning...")
          final_review = query_openrouter(
              "nvidia/nemotron-3.5-lightning:free",
              [
                  {"role": "system", "content": "You are an expert review consolidator that produces clear, actionable GitHub PR feedback."},
                  {"role": "user", "content": synthesis_prompt}
              ],
              temperature=0.4,
              timeout=90
          )

          final_body = (
              "## 🤖 Automated Code Review\n\n"
              f"{final_review}\n\n"
              "---\n"
              "*Consolidated by `nvidia/nemotron-3.5-lightning:free` from independent analyses by "
              "`nvidia/nemotron-3.5-super-vl:free` and `nvidia/nemotron-3-ultra-550b-a55b:free`.*"
          )

          with open("review_comment.md", "w", encoding="utf-8") as out:
              out.write(final_body)
          EOF

      - name: Post Comment to PR
        if: steps.get_diff.outputs.empty == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            -F body=@review_comment.md
