name: AI PR Multi-Model Code Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PR Diff
        id: get_diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" \
            -H "Accept: application/vnd.github.diff" > pr_diff.patch

          if [ ! -s pr_diff.patch ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Static Bug Analysis (Semgrep)
        if: steps.get_diff.outputs.empty == 'false'
        continue-on-error: true
        run: |
          pip install --quiet semgrep
          semgrep scan --config auto --json --output semgrep_results.json || true

      - name: Run Multi-Model Review Pipeline
        if: steps.get_diff.outputs.empty == 'false'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - << 'EOF'
          import os
          import sys
          import json
          import urllib.request
          import urllib.error
          from concurrent.futures import ThreadPoolExecutor

          api_key = os.environ.get("NVIDIA_API_KEY")
          repo = os.environ.get("REPO_NAME", "")
          pr_num = os.environ.get("PR_NUMBER", "")
          pr_title = os.environ.get("PR_TITLE", "No title provided")
          pr_body = os.environ.get("PR_BODY", "No description provided")

          if not api_key:
              print("Missing NVIDIA_API_KEY secret.")
              sys.exit(1)

          with open("pr_diff.patch", "r", encoding="utf-8", errors="ignore") as f:
              diff_text = f.read()

          MAX_CHARS = 80000
          if len(diff_text) > MAX_CHARS:
              diff_text = diff_text[:MAX_CHARS] + "\n\n... [Diff truncated due to size limits] ..."

          # Parse Semgrep findings if available
          semgrep_findings = "No deterministic static issues found."
          if os.path.exists("semgrep_results.json"):
              try:
                  with open("semgrep_results.json", "r", encoding="utf-8") as f:
                      s_data = json.load(f)
                      matches = [
                          f"[{m.get('check_id', 'issue')}] {m.get('path', '')}:{m.get('start', {}).get('line', '')} - {m.get('extra', {}).get('message', '')}"
                          for m in s_data.get("results", [])
                      ]
                      if matches:
                          semgrep_findings = "\n".join(matches[:15])
              except Exception as e:
                  semgrep_findings = f"Could not parse Semgrep results: {e}"

          # Try to gather project context
          project_context = ""
          for ctx_file in ["README.md", "DESIGN.md", "CONTRIBUTING.md"]:
              if os.path.exists(ctx_file):
                  try:
                      with open(ctx_file, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                          if len(content) > 2000:
                              content = content[:2000] + "\n\n... [truncated] ..."
                          project_context += f"\n### {ctx_file}\n{content}\n"
                  except Exception:
                      pass
                  break

          def query_nim(model_id, messages, temperature=0.7, timeout=120):
              payload = {
                  "model": model_id,
                  "messages": messages,
                  "temperature": temperature
              }
              req = urllib.request.Request(
                  "https://integrate.api.nvidia.com/v1/chat/completions",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                      "Accept": "application/json"
                  }
              )
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      res_data = json.loads(response.read().decode("utf-8"))
                      return res_data["choices"][0]["message"]["content"]
              except urllib.error.HTTPError as e:
                  err_msg = e.read().decode("utf-8", errors="ignore")
                  print(f"Error querying {model_id} ({e.code}): {err_msg}")
                  return f"⚠️ Analysis skipped due to API error ({e.code})."
              except Exception as e:
                  print(f"Exception querying {model_id}: {e}")
                  return f"⚠️ Analysis error: {str(e)}"

          # Inspection prompt combining Diff + Semgrep Findings + PR Intent
          analysis_prompt = f"""You are an expert code reviewer. Your task is to review the provided code changes (git diff format) and offer constructive feedback.

          Project Context:{project_context}

          The changes were made as part of the following task:
          Title: {pr_title}
          Description: {pr_body}

          Static Analysis (Semgrep) Output:
          {semgrep_findings}

          Please focus your review on: code quality, best practices, potential bugs, readability, maintainability, performance, and security.

          Review the git diff below. Highlight potential bugs, suggest improvements for readability, maintainability, performance, and adherence to best practices. If you see positive aspects, mention them too. Structure your review logically by file or theme.

          Strict guidelines:
          - Cite the specific file and line numbers where an issue exists.
          - Offer a concise, practical code fix.
          - Do NOT include stylistic or subjective formatting comments.
          - Cross-reference the PR's stated intent with the actual changes and flag discrepancies.
          - Investigate Semgrep findings and determine if they represent real issues or false alarms.
          - If the diff looks sound, confirm that no critical issues were detected.

          Git Diff:
          ```diff
          {diff_text}
          ```
          """

          messages = [
              {"role": "system", "content": "You are an expert code reviewer focused on producing actionable, balanced feedback."},
              {"role": "user", "content": analysis_prompt}
          ]

          # Define all analyzer models to run in parallel
          ANALYZER_MODELS = [
              "nvidia/nemotron-3.5-super-vl",
              "nvidia/nemotron-3-ultra-550b-a55b",
          ]

          print(f"Querying {len(ANALYZER_MODELS)} analyzer models in parallel...")
          reports = {}
          with ThreadPoolExecutor(max_workers=len(ANALYZER_MODELS)) as executor:
              future_to_model = {
                  executor.submit(query_nim, model, messages, 1.0, 120): model
                  for model in ANALYZER_MODELS
              }
              for future in future_to_model:
                  model_name = future_to_model[future]
                  reports[model_name] = future.result()

          # Build the consolidated prompt dynamically
          formatted_reports = "\n\n".join(
              [f"### Report from {m}:\n{text}" for m, text in reports.items()]
          )

          # Synthesis prompt
          synthesis_prompt = f"""You are a Principal Software Architect synthesizing {len(ANALYZER_MODELS)} automated code review reports into an executive GitHub PR review comment.

          ### PR Context:
          - **Title**: {pr_title}
          - **Description**: {pr_body}

          ### Raw Engine Reports:
          {formatted_reports}

          ### Static Analysis Findings (Semgrep):
          {semgrep_findings}

          ### Output Rules & GitHub Markdown Requirements:
          1. **Never place multiline code blocks inside table cells** (this breaks GitHub Markdown tables). Use tables ONLY for brief 1-line summaries.
          2. Structure the review into these exact sections:

          ### 🚦 Executive Verdict
          - A 1-2 sentence overall assessment of stability and merge-readiness.
          - A concise Markdown summary table:
          | Priority | File & Line | Summary | Confidence |
          |---|---|---|---|
          | 🔴 Blocker | `api/alerts.go:119` | Missing zero/negative validation | High |
          | 🟡 Warning | `pkg/alerts/engine.go:43` | Unused mutex in Check() | High |

          ### 🛠️ Actionable Findings
          For each finding, create an individual block formatted like this:

          #### 🔴 [Blocker/Warning/Info]: Short Title
          - **File**: `path/to/file.go:L123`
          - **Impact**: Explain the exact runtime risk or bug.
          - **Suggested Fix**:
          ```go
          // Clean, runnable code snippet here
          ```
          """

          print("Synthesizing final comment with Nemotron 3.5 Lightning...")
          final_review = query_nim(
              "nvidia/nemotron-3.5-lightning",
              [
                  {"role": "system", "content": "You are an expert review consolidator that produces clear, actionable GitHub PR feedback."},
                  {"role": "user", "content": synthesis_prompt}
              ],
              temperature=0.4,
              timeout=90
          )

          final_body = (
              "## 🤖 Automated Code Review\n\n"
              f"{final_review}\n\n"
              "---\n"
              "*Consolidated by `nvidia/nemotron-3.5-lightning` from independent analyses by "
              "`nvidia/nemotron-3.5-super-vl` and `nvidia/nemotron-3-ultra-550b-a55b`.*"
          )

          with open("review_comment.md", "w", encoding="utf-8") as out:
              out.write(final_body)
          EOF

      - name: Post Comment to PR
        if: steps.get_diff.outputs.empty == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            -F body=@review_comment.md
